<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HONDVO 后端管理系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script defer src="script.js?v=10"></script>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="page-login">
  <div class="login-card">
    <div class="login-logo">
      <div class="brand-icon">H</div>
      <h1>HONDVO 管理系统</h1>
      <p>弘欧科技 · 后端管理平台</p>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label>账号</label>
        <input type="text" id="login-user" class="form-input" placeholder="请输入账号" autocomplete="off">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="login-pass" class="form-input" placeholder="请输入密码">
      </div>
      <label class="remember-me"><input type="checkbox" id="login-remember"><span>记住账号密码</span></label>
      <div class="login-error" id="login-error">账号或密码错误</div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">登录系统</button>
    </form>
  </div>
</div>

<!-- APP LAYOUT -->
<div class="app-layout" id="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="images/logo.png" class="b-logo" alt="HONDVO">
      <div class="b-text">HONDVO</div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section"><span>主菜单</span></div>
      <a class="nav-item active" data-page="dashboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        数据总览
      </a>
      <div class="sidebar-section"><span>内容编辑</span></div>
      <!-- 首页 -->
      <a class="nav-item" data-page="edit-home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        首页
      </a>
      <!-- 关于我们 -->
      <div class="nav-group">
        <div class="nav-item nav-parent" onclick="toggleNavGroup(this)">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          关于我们
          <svg class="nav-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="nav-children">
          <a class="nav-item nav-child" data-page="edit-about-who">我们是谁</a>
          <a class="nav-item nav-child" data-page="edit-about-values">核心价值</a>
          <a class="nav-item nav-child" data-page="edit-about-spirit">弘欧精神</a>
          <a class="nav-item nav-child" data-page="edit-about-partners">全球合作伙伴</a>
          <a class="nav-item nav-child" data-page="edit-about-cases">客户案例</a>
          <a class="nav-item nav-child" data-page="edit-about-team">团队</a>
        </div>
      </div>
      <!-- 产品与服务 -->
      <div class="nav-group">
        <div class="nav-item nav-parent" onclick="toggleNavGroup(this)">
          <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          产品与服务
          <svg class="nav-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="nav-children">
          <a class="nav-item nav-child" data-page="edit-products-page">页面编辑</a>
          <a class="nav-item nav-child" data-page="edit-products-lsr">LSR 液体硅胶产品</a>
          <a class="nav-item nav-child" data-page="edit-products-injection">注塑产品</a>
          <a class="nav-item nav-child" data-page="edit-products-2k">双色/多色产品</a>
        </div>
      </div>
      <!-- 模具中心 -->
      <div class="nav-group">
        <div class="nav-item nav-parent" onclick="toggleNavGroup(this)">
          <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
          模具中心
          <svg class="nav-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="nav-children">
          <a class="nav-item nav-child" data-page="edit-mold-page">页面编辑</a>
          <a class="nav-item nav-child" data-page="edit-mold-cnc">CNC 数控加工</a>
          <a class="nav-item nav-child" data-page="edit-mold-edm">EDM 电火花</a>
          <a class="nav-item nav-child" data-page="edit-mold-wedm">线切割</a>
          <a class="nav-item nav-child" data-page="edit-mold-grinder">精密磨床</a>
          <a class="nav-item nav-child" data-page="edit-mold-injection">注塑机</a>
          <a class="nav-item nav-child" data-page="edit-mold-qa">品质检测</a>
        </div>
      </div>
      <!-- 资质实力 -->
      <div class="nav-group">
        <div class="nav-item nav-parent" onclick="toggleNavGroup(this)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
          资质实力
          <svg class="nav-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="nav-children">
          <a class="nav-item nav-child" data-page="edit-qualifications">资质证书</a>
          <a class="nav-item nav-child" data-page="edit-qual-env">生产环境</a>
          <a class="nav-item nav-child" data-page="edit-qual-iqoqpq">IQ/OQ/PQ 验证体系</a>
        </div>
      </div>
      <!-- 新闻动态 -->
      <div class="nav-group">
        <div class="nav-item nav-parent" onclick="toggleNavGroup(this)">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          新闻动态
          <svg class="nav-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="nav-children">
          <a class="nav-item nav-child" data-page="edit-news-content">新闻动态</a>
        </div>
      </div>
      <!-- 联系我们 -->
      <a class="nav-item" data-page="edit-contact">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        联系我们
      </a>
      <div class="sidebar-section"><span>内容管理</span></div>
      <a class="nav-item" data-page="media">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        媒体库
      </a>
      <a class="nav-item" data-page="inquiries">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        询盘管理
      </a>
      <div class="sidebar-section"><span>系统设置</span></div>
      <a class="nav-item" data-page="i18n">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        多语言
      </a>
      <a class="nav-item" data-page="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        系统设置
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="avatar">管</div>
      <div class="user-info">
        <div class="user-name">管理员</div>
        <div class="user-role">超级管理员</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()" style="color:var(--slate-400)">退出</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" id="main-content">
    <header class="main-header">
      <button class="menu-toggle" onclick="toggleSidebar()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h2 id="page-title">数据总览</h2>
    </header>
    <div class="main-body">
      <div class="main-content" id="main-content-inner">
        <!-- Pages rendered by JS -->
      </div>
      <aside class="publish-panel" id="publish-panel">
        <div class="publish-panel-head">
          <span class="publish-panel-title">发布控制</span>
          <span class="publish-unpub-flag" id="publish-unpub-flag" hidden><i></i>有未发布改动</span>
        </div>
        <div class="publish-ops">
          <div class="publish-status-row">
            <span class="publish-status-dot" id="publish-status-dot"></span>
            <span class="publish-status-text" id="publish-status-text">草稿</span>
          </div>
          <div class="publish-field">
            <label class="publish-label">当前版本</label>
            <div class="publish-version" id="publish-version">v1.0.0</div>
          </div>
          <div class="publish-field">
            <label class="publish-label">发布说明</label>
            <textarea class="publish-notes" id="publish-notes" placeholder="记录本次改动内容"></textarea>
          </div>
          <div class="publish-btns">
            <button class="btn btn-primary" id="btn-publish">确认发布</button>
            <button class="btn btn-secondary" id="btn-draft">存为草稿</button>
          </div>
        </div>
        <div class="publish-history">
          <div class="publish-history-head">发布历史</div>
          <div class="publish-history-list" id="publish-history-list"></div>
        </div>
      </aside>
    </div>
  </main>
</div>

<!-- MODAL CONTAINER -->
<div id="modal-container"></div>
<!-- TOAST CONTAINER -->
<div class="toast-container" id="toast-container"></div>

</body>
</html>
